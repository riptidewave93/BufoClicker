services:
  build:
    build:
      context: .
      target: tools
    user: "${BUFO_UID:-1000}:${BUFO_GID:-1000}"
    volumes:
      - .:/app
    command: perl scripts/build.pl
  test:
    extends: build
    command: prove -lr t
  dev:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  site:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:80"
  webdriver:
    image: selenium/standalone-chromium:4.34.0
    profiles: [browser]
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
  browser-test:
    extends: build
    profiles: [browser]
    depends_on: [site, webdriver]
    environment:
      WEBDRIVER_URL: http://webdriver:4444
      BUFO_URL: http://site
    command: perl scripts/browser-test.pl
