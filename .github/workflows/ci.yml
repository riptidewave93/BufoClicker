name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Perl and build static site
        run: docker build --target build -t bufo-build .
      - name: Exercise browser flows
        run: BUFO_UID=$(id -u) BUFO_GID=$(id -g) docker compose --profile browser run --build --rm browser-test
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/
      - name: Stop test containers
        if: always()
        run: docker compose --profile browser down
